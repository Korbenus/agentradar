name: Editorial research brief
on:
  workflow_dispatch:
    inputs:
      product_name:
        description: Product name to research
        required: true
        type: string
      official_source_url:
        description: Official HTTPS product page (to be verified during review)
        required: true
        type: string
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create unpublished brief
        env:
          PRODUCT_NAME: ${{ inputs.product_name }}
          OFFICIAL_SOURCE_URL: ${{ inputs.official_source_url }}
        run: python scripts/radar.py --name "$PRODUCT_NAME" --source-url "$OFFICIAL_SOURCE_URL"
      - name: Save brief for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-research-brief
          path: editorial/drafts/*.json
          if-no-files-found: error
